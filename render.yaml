services:
  - type: web
    name: sma-portal-backend
    env: java
    plan: free
    buildCommand: mvn clean install -DskipTests
    startCommand: java -jar target/awareness-portal-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sma-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sma-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sma-db
          property: password

databases:
  - name: sma-db
    plan: free
