# Performance & Data Storage Optimization
spring.application.name=SMA Awareness Portal
server.port=${PORT:8080}

# Database Configuration (Smart Switch)
# If local, it uses postgres. If Render, it uses the provided URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sma_awareness}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}

# Optimization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security Fix for Browser access
management.endpoints.web.exposure.include=*
server.error.include-message=always
